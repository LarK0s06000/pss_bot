name: Veille PSS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Laisser vide pour un passage normal, ou --calibrer"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pss
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py ${{ inputs.mode }}
      - name: Sauvegarder la mémoire
        run: |
          if [ -f state.json ]; then
            git config user.name "pss-bot"
            git config user.email "pss-bot@users.noreply.github.com"
            git add state.json
            git diff --staged --quiet || (git commit -m "maj état" && git push)
          fi

